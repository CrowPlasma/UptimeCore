<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="favOrbit" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="favGlow" cx="16" cy="16" r="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fondo redondeado con borde sutil -->
  <rect width="32" height="32" rx="8.5" fill="url(#favBg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="8" stroke="#4f46e5" stroke-opacity="0.4"/>
  
  <!-- Resplandor -->
  <circle cx="16" cy="16" r="6" fill="url(#favGlow)"/>

  <!-- Anillo orbital exterior 360° con corte dinámico -->
  <circle cx="16" cy="16" r="11" stroke="url(#favOrbit)" stroke-width="2.6" stroke-dasharray="55 14" stroke-linecap="round"/>

  <!-- Órbita de radar concéntrica -->
  <circle cx="16" cy="16" r="6.5" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2.5 2.5" stroke-opacity="0.7"/>

  <!-- Núcleo central activo (Core Uptime) -->
  <circle cx="16" cy="16" r="3" fill="#22c55e"/>
  <circle cx="17" cy="15" r="1" fill="#ffffff" fill-opacity="0.9"/>
</svg>
